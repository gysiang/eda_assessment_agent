name: Automated AI Repo Review

on:
  workflow_dispatch: # This makes it strictly manual

jobs:
  review-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai pydantic

      - name: Run AI Review Agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python main.py --repo-path "." --output "evaluation_report.md"

      - name: Upload Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: project-feedback-report
          path: evaluation_report.md
